<!-- podmicusb-doctor app icon: source of podmicusb-doctor.ico (the exe icon, sizes 16-256 px). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef5a5f"/>
      <stop offset="1" stop-color="#c9353a"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="256" height="256" rx="52" fill="url(#red)"/>
  <!-- capsule with two grille bands -->
  <rect x="92" y="34" width="72" height="118" rx="36" fill="#fff"/>
  <path d="M100 74 H156 M100 96 H156" stroke="#d8434a" stroke-width="9" stroke-linecap="round"/>
  <!-- yoke, stem, base -->
  <path d="M70 118 V128 a58 58 0 0 0 116 0 V118" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <rect x="120" y="186" width="16" height="30" fill="#fff"/>
  <rect x="88" y="210" width="80" height="16" rx="8" fill="#fff"/>
  <!-- plus -->
  <path d="M196 30 h16 v18 h18 v16 h-18 v18 h-16 v-18 h-18 v-16 h18 z" fill="#fff"/>
</svg>
